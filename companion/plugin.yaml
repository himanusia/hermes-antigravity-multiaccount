name: antigravity-companion
version: "0.2.0"
description: "Companion for the antigravity-subscription-directsdk provider. Registers image_gen and stt provider `antigravity` (agy image-generator subagent and audio transcription, served by the same multi-account rotation as the provider) and the `hermes antigravity` CLI. Lists Antigravity accounts with subscription eligibility and remaining quota, runs the official agy binary as a stored account, and inspects per-account quota. Reads the same on-disk contract as the provider (account registry plus one isolated HOME per account) and never prints tokens."
author: "himanusia"
license: MIT
kind: standalone
platforms:
  - linux
  - macos
  - windows
requires_hermes: ">=0.21.0"
